<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Gallery</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color:#f4f4f4;
            text-align:center;
            margin:20px;
        }

        h1{
            color:#2e7d32;
        }

        .gallery{
            display:flex;
            justify-content:center;
            align-items:flex-start;
            gap:20px;
            flex-wrap:wrap;
            margin-top:20px;
        }

        .card{
            width:280px;
            background:white;
            border-radius:10px;
            box-shadow:0px 3px 8px rgba(0,0,0,0.2);
            padding:10px;
        }

        .card img{
            width:100%;
            height:180px;
            object-fit:cover;
            border-radius:8px;
            cursor:pointer;
            transition:0.3s;
        }

        .card img:hover{
            transform:scale(1.05);
        }

        figcaption{
            margin-top:10px;
            font-weight:bold;
            color:#2e7d32;
        }

        details{
            margin-top:10px;
        }

        summary{
            cursor:pointer;
            color:#00695c;
            font-weight:bold;
        }

        .info{
            margin-top:10px;
            padding:10px;
            background:#e8f5e9;
            border:1px solid #81c784;
            border-radius:6px;
            text-align:left;
            line-height:1.5;
        }
    </style>

</head>

<body>

<h1>Farm Gallery</h1>

<div class="gallery">

    <div class="card">

        <figure>

            <details>

                <summary>

                    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Sugarcane_Field.jpg"
                    alt="Healthy Sugarcane Crop"
                    title="Healthy Sugarcane Crop">

                </summary>

                <figcaption>Healthy Sugarcane Crop</figcaption>

                <div class="info">

                    Healthy sugarcane has green leaves, thick stalks and
                    requires proper irrigation, sunlight and nutrients.
                    Healthy crops produce better yield and higher sugar content.

                </div>

            </details>

        </figure>

    </div>





    <div class="card">

        <figure>

            <details>

                <summary>

                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/79/Drip_irrigation.jpg"
                    alt="Drip Irrigation System"
                    title="Drip Irrigation System">

                </summary>

                <figcaption>Drip Irrigation System</figcaption>

                <div class="info">

                    Drip irrigation supplies water directly to the roots.
                    It saves water, improves efficiency and reduces water
                    wastage compared to traditional irrigation methods.

                </div>

            </details>

        </figure>

    </div>






    <div class="card">

        <figure>

            <details>

                <summary>

                    <img src="https://cdn.pixabay.com/photo/2017/09/08/21/38/technology-2729045_1280.jpg"
                    alt="Soil Moisture Sensor"
                    title="Soil Moisture Sensor">

                </summary>

                <figcaption>Soil Moisture Sensor</figcaption>

                <div class="info">

                    Soil moisture sensors measure the amount of water present
                    in the soil. They help the CaneSense system determine when
                    irrigation is required.

                </div>

            </details>

        </figure>

    </div>






    <div class="card">

        <figure>

            <details>

                <summary>

                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/58/Weather_station.jpg"
                    alt="Weather Monitoring Station"
                    title="Weather Monitoring Station">

                </summary>

                <figcaption>Weather Monitoring Station</figcaption>

                <div class="info">

                    Weather monitoring stations collect temperature,
                    humidity, rainfall and wind data. This information
                    helps generate accurate irrigation recommendations.

                </div>

            </details>

        </figure>

    </div>

</div>

</body>
</html>
