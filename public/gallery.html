<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Gallery</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color:#f4f4f4;
            text-align:center;
            margin:20px;
        }

        h1{
            color:#2e7d32;
        }

        .gallery{
            display:flex;
            justify-content:center;
            align-items:flex-start;
            gap:20px;
            flex-wrap:wrap;
            margin-top:20px;
        }

        .card{
            width:280px;
            background:white;
            border-radius:10px;
            box-shadow:0px 3px 8px rgba(0,0,0,0.2);
            padding:10px;
        }

        .card img{
            width:100%;
            height:180px;
            object-fit:cover;
            border-radius:8px;
            cursor:pointer;
            transition:0.3s;
        }

        .card img:hover{
            transform:scale(1.05);
        }

        figcaption{
            margin-top:10px;
            font-weight:bold;
            color:#2e7d32;
        }

        details{
            margin-top:10px;
        }

        summary{
            cursor:pointer;
            color:#00695c;
            font-weight:bold;
        }

        .info{
            margin-top:10px;
            padding:10px;
            background:#e8f5e9;
            border:1px solid #81c784;
            border-radius:6px;
            text-align:left;
            line-height:1.5;
        }
    </style>

</head>

<body>

<h1>Farm Gallery</h1>

<div class="gallery">

    <div class="card">

        <figure>

            <details>

                <summary>

                    <img src="images/sugarcane_crop.png"
                    alt="Healthy Sugarcane Crop"
                    title="Healthy Sugarcane Crop">

                </summary>

                <figcaption>Healthy Sugarcane Crop</figcaption>

                <div class="info">

<h3>Healthy Sugarcane Crop</h3>

<p>
Sugarcane (<i>Saccharum officinarum</i>) is a tropical crop cultivated for
the production of sugar, jaggery, ethanol and biofuel. It requires a warm
climate with temperatures between <b>20°C and 35°C</b>, fertile
well-drained loamy soil and abundant sunlight for optimum growth.
</p>

<p>
A healthy sugarcane crop has bright green leaves, thick and straight stalks,
well-developed roots and minimal pest or disease damage. Maintaining soil
moisture between <b>60–80%</b> of field capacity promotes healthy root
development and increases sugar accumulation.
</p>

<p>
The crop generally requires about <b>1500–2500 mm</b> of water throughout
its growing season. Timely irrigation, balanced fertilizers containing
Nitrogen (N), Phosphorus (P) and Potassium (K), and proper weed management
significantly improve cane yield and sugar recovery.
</p>

</div>

            </details>

        </figure>

    </div>





    <div class="card">

        <figure>

            <details>

                <summary>

                    <img src="images/drip_irrigation.png"
                    alt="Drip Irrigation System"
                    title="Drip Irrigation System">

                </summary>

                <figcaption>Drip Irrigation System</figcaption>

                <div class="info">

                    <h3>Drip Irrigation System</h3>

<p>
Drip irrigation is a modern irrigation technique in which water is supplied
slowly and directly to the root zone through pipes, emitters and valves.
This method minimizes evaporation and surface runoff.
</p>

<p>
Compared to flood irrigation, drip irrigation can reduce water consumption
by <b>30–60%</b> while increasing crop productivity. It provides uniform
soil moisture, improves nutrient uptake and reduces weed growth because
water reaches only the crop roots.
</p>

<p>
In sugarcane cultivation, drip irrigation is especially beneficial during
the germination and grand growth stages where water demand is high.
Fertilizers can also be supplied through the drip system using a process
called <b>fertigation</b>, improving fertilizer efficiency.
</p>

<p>
Major components include:
<ul>
<li>Main pipeline</li>
<li>Sub-main pipes</li>
<li>Drip laterals</li>
<li>Emitters</li>
<li>Filters</li>
<li>Control valves</li>
</ul>
</p>



                </div>

            </details>

        </figure>

    </div>






    <div class="card">

        <figure>

            <details>

                <summary>

                    <img src="images/soil_sensor.png"
                    alt="Soil Moisture Sensor"
                    title="Soil Moisture Sensor">

                </summary>

                <figcaption>Soil Moisture Sensor</figcaption>

                <div class="info">

                    <h3>Soil Moisture Sensor</h3>

<p>
A soil moisture sensor measures the amount of water present in the soil.
It continuously monitors soil conditions and sends real-time data to the
CaneSense irrigation system.
</p>

<p>
The sensor works by measuring changes in electrical resistance or
capacitance of the soil. Wet soil conducts electricity differently than dry
soil, allowing the sensor to estimate moisture content accurately.
</p>

<p>
The sensor readings help determine:
</p>

<ul>
<li>When irrigation should start</li>
<li>When irrigation should stop</li>
<li>Amount of water required</li>
<li>Water stress level of the crop</li>
<li>Overall soil health</li>
</ul>

<p>
Using soil moisture sensors prevents both over-irrigation and
under-irrigation, conserving water while promoting healthy root growth and
higher crop yield.
</p>


                </div>

            </details>

        </figure>

    </div>






    <div class="card">

        <figure>

            <details>

                <summary>

                    <img src="images/weather_station.png"
                    alt="Weather Monitoring Station"
                    title="Weather Monitoring Station">

                </summary>

                <figcaption>Weather Monitoring Station</figcaption>

                <div class="info">

                    <h3>Weather Monitoring Station</h3>

<p>
A weather monitoring station is an automated system that continuously
collects environmental data required for precision agriculture. It plays a
key role in generating accurate irrigation recommendations.
</p>

<p>
The station measures several weather parameters, including:
</p>

<ul>
<li>Air Temperature</li>
<li>Relative Humidity</li>
<li>Rainfall</li>
<li>Wind Speed</li>
<li>Wind Direction</li>
<li>Atmospheric Pressure</li>
<li>Solar Radiation</li>
</ul>

<p>
The collected data is transmitted to the CaneSense platform where AI
algorithms analyze weather conditions along with soil moisture data.
If rainfall is expected, irrigation can be postponed, preventing water
wastage and reducing irrigation costs.
</p>

<p>
Weather monitoring stations improve irrigation planning, increase water-use
efficiency, reduce crop stress and support sustainable farming practices.
</p>
                </div>

            </details>

        </figure>

    </div>

</div>
